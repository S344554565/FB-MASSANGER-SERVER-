<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>FB Auto Tool — {{ owner }}</title>
<style>
  body{background:#0f172a;color:#e2e8f0;font-family:system-ui;padding:20px}
  .card{background:#1e293b;border-radius:12px;padding:20px;max-width:720px;margin:auto;box-shadow:0 8px 24px rgba(0,0,0,.3)}
  h1{font-size:20px;margin:0 0 16px;color:#38bdf8}
  input,select{width:100%;padding:10px;margin:6px 0 12px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#e2e8f0}
  button{padding:10px 18px;border-radius:8px;border:none;font-weight:600;cursor:pointer;margin-right:8px}
  .start{background:#22c55e;color:#fff}.stop{background:#ef4444;color:#fff}
  #log{background:#020617;border-radius:8px;padding:12px;height:260px;overflow-y:auto;font-family:monospace;font-size:12px;white-space:pre-wrap;margin-top:12px}
  .badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:12px}
  .on{background:#22c55e;color:#000}.off{background:#64748b;color:#fff}
  .owner{text-align:center;margin-top:14px;font-size:12px;color:#94a3b8}
</style>
</head>
<body>
<div class="card">
  <h1>🚀 Facebook Auto Tool &nbsp; <span id="status" class="badge off">STOPPED</span></h1>

  <label>Name here</label><input id="name" placeholder="Your name">
  <label>Api token paste</label><input id="api_token" placeholder="EAAG...">
  <label>Last name</label><input id="last_name">
  <label>Page ID (Group UID की जगह)</label><input id="page_id">
  <label>Time (seconds)</label><input id="interval" type="number" value="60">
  <label>Mode</label>
  <select id="mode">
    <option value="post">Page Post (Non-stop)</option>
    <option value="messenger">Massager Bulk</option>
  </select>
  <label>Import file (data/posts.txt / data/contacts.csv)</label>
  <input value="data/posts.txt" disabled>

  <button class="start" onclick="start()">▶ Start</button>
  <button class="stop" onclick="stop()">■ Stop</button>

  <div id="log"></div>
  <div class="owner">{{ owner }}</div>
</div>

<script>
async function start(){
  const d = {
    name: name.value, api_token: api_token.value, last_name: last_name.value,
    page_id: page_id.value, interval: interval.value, mode: mode.value
  };
  await fetch('/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});
}
async function stop(){ await fetch('/stop',{method:'POST'}); }

async function poll(){
  const r = await fetch('/status'); const s = await r.json();
  document.getElementById('status').textContent = s.running ? 'RUNNING' : 'STOPPED';
  document.getElementById('status').className = 'badge ' + (s.running?'on':'off');
  document.getElementById('log').textContent = s.log.join('\n');
}
setInterval(poll, 2000); poll();
</script>
</body>
</html>
